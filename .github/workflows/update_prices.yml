name: Automated CPO Pricing Pipeline

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx pydantic shapely

      - name: Run Pricing Scraper Pipeline
        env:
          OCM_API_KEY: ${{ secrets.OCM_API_KEY }}
        run: |
          python -m pipeline.scraper

      - name: Commit and Push Updated Pricing Data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Pricing Bot"
          git add data/prices.json data/prices.db
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update station pricing database [skip ci]" && git push)
